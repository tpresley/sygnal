<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Sygnal app graph (S-1 explore)</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --card: #ffffff; --ink: #18202b; --muted: #667085; --faint: #98a2b3;
  --line: #e4e7ec; --edge: #98a2b3; --grid: #e9ecf1; --accent: #4f46e5; --accent-soft: #eef2ff;
  --k-root: #4f46e5; --k-child: #64748b; --k-coll: #059669; --k-switch: #d97706; --k-ghost: #98a2b3;
  --ev: #9333ea; --ctx: #0891b2; --err: #dc2626; --warn: #d97706; --info: #2563eb; --ok: #16a34a;
  --err-soft: #fef2f2; --warn-soft: #fffbeb; --chip: #f2f4f7; --group: #f0f2f7; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1117; --panel: #151b23; --card: #1b222c; --ink: #e6edf3; --muted: #9da7b3; --faint: #6e7781;
  --line: #2b3440; --edge: #5b6573; --grid: #1a2029; --accent: #8b8cf6; --accent-soft: #23243f;
  --k-root: #8b8cf6; --k-child: #94a3b8; --k-coll: #34d399; --k-switch: #fbbf24; --k-ghost: #6e7781;
  --ev: #c084fc; --ctx: #22d3ee; --err: #f87171; --warn: #fbbf24; --info: #60a5fa; --ok: #4ade80;
  --err-soft: #2a1617; --warn-soft: #2a2312; --chip: #232b36; --group: #18202a; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0d1117; --panel: #151b23; --card: #1b222c; --ink: #e6edf3; --muted: #9da7b3; --faint: #6e7781;
  --line: #2b3440; --edge: #5b6573; --grid: #1a2029; --accent: #8b8cf6; --accent-soft: #23243f;
  --k-root: #8b8cf6; --k-child: #94a3b8; --k-coll: #34d399; --k-switch: #fbbf24; --k-ghost: #6e7781;
  --ev: #c084fc; --ctx: #22d3ee; --err: #f87171; --warn: #fbbf24; --info: #60a5fa; --ok: #4ade80;
  --err-soft: #2a1617; --warn-soft: #2a2312; --chip: #232b36; --group: #18202a; --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; grid-template-rows: 52px 1fr; grid-template-columns: 300px 1fr auto; grid-template-areas: "top top top" "side canvas detail"; overflow: hidden; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
button, select, input { font: inherit; color: inherit; }
header { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; white-space: nowrap; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--ev)); display: grid; place-items: center; color: #fff; font-size: 13px; }
.brand small { color: var(--muted); font-weight: 450; }
.search { flex: 0 1 360px; position: relative; margin-left: 8px; }
.search input { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 40px 0 10px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search .count { position: absolute; right: 10px; top: 7px; color: var(--muted); font-size: 12px; }
.results { position: absolute; top: 36px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 60vh; overflow: auto; z-index: 30; display: none; }
.results.open { display: block; }
.results .r { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.results .r:hover, .results .r.on { background: var(--chip); }
.results .r small { color: var(--muted); margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
.results .why { color: var(--ev); font-size: 11px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.iconbtn { border: 1px solid var(--line); background: var(--panel); height: 32px; min-width: 32px; padding: 0 9px; border-radius: 8px; cursor: pointer; color: var(--muted); }
aside.side { grid-area: side; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
.sec { padding: 12px 14px 6px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.sec.closed > :not(h3) { display: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.stat b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 11px; }
.stat.err b { color: var(--err); } .stat.warn b { color: var(--warn); }
.ctl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 8px; align-items: center; font-size: 12px; }
.ctl label { color: var(--muted); }
.ctl select, .ctl input[type=number] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
.checks { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12px; margin-top: 6px; }
.checks label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.health-item { display: flex; gap: 8px; padding: 4px 8px; border-radius: 7px; cursor: pointer; align-items: flex-start; }
.health-item:hover { background: var(--chip); }
.health-item .dot, .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; display: inline-block; }
.health-item .t { flex: 1; min-width: 0; }
.health-item .t small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.health-group summary { cursor: pointer; padding: 4px 2px; font-weight: 600; list-style: none; display: flex; gap: 6px; align-items: center; }
.health-group summary::-webkit-details-marker { display: none; }
.health-group summary .n { margin-left: auto; color: var(--muted); font-weight: 500; }
/* outline */
.ol { font-size: 12.5px; }
.ol-row { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.ol-row:hover { background: var(--chip); }
.ol-row.sel { background: var(--accent-soft); color: var(--accent); }
.ol-row .tw { width: 12px; color: var(--faint); flex: none; text-align: center; font-size: 10px; }
.ol-row .k { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.ol-row .hint { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.ol-row .b { margin-left: auto; display: flex; gap: 3px; flex: none; }
.ol-kids { padding-left: 12px; border-left: 1px solid var(--line); margin-left: 11px; }
.pillx { font-size: 10px; font-weight: 700; padding: 0 5px; border-radius: 999px; color: #fff; }
main { grid-area: canvas; position: relative; overflow: hidden; }
#svg, #cv { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; position: absolute; inset: 0; }
#cv { display: none; }
.zoombar { position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.zoombar button { border: 0; background: none; width: 34px; height: 30px; cursor: pointer; color: var(--muted); font-size: 15px; }
.zoombar button + button { border-top: 1px solid var(--line); }
#minimap { position: absolute; right: 14px; bottom: 14px; width: 220px; height: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); cursor: crosshair; }
.crumbs { position: absolute; left: 14px; top: 12px; right: 70px; display: none; align-items: center; gap: 4px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px 8px; font-size: 12px; }
.crumbs.on { display: flex; }
.crumbs a { color: var(--accent); cursor: pointer; } .crumbs .sep { color: var(--faint); }
.crumbs button { margin-left: auto; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; padding: 1px 8px; }
.trace { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.12); padding: 6px 8px 6px 14px; display: none; align-items: center; gap: 10px; max-width: 70%; }
.trace.on { display: flex; }
.trace a { color: var(--accent); cursor: pointer; }
.trace button { border: 0; background: var(--chip); border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.perf { position: absolute; left: 14px; bottom: 14px; color: var(--muted); font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: ui-monospace, Menlo, monospace; }
/* svg graph */
.node { cursor: pointer; }
.node .box { fill: var(--card); stroke: var(--line); stroke-width: 1; }
.node:hover .box { stroke: var(--faint); }
.node.sel .box { stroke: var(--accent); stroke-width: 2.5; }
.node.has-err .box { stroke: var(--err); } .node.has-warn .box { stroke: var(--warn); }
.node.ghost .box { fill: transparent; stroke: var(--k-ghost); stroke-dasharray: 5 4; }
.node.dimf { opacity: .45; }
.node .name { font-weight: 650; font-size: 14px; fill: var(--ink); }
.node .sub { font-size: 11px; fill: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.node .meta { font-size: 11px; fill: var(--muted); }
.node .meta tspan.n { fill: var(--ink); font-weight: 600; }
.node .pill text, .node .fold text { font-size: 10.5px; font-weight: 700; fill: #fff; }
.node.match .box { stroke: var(--accent); stroke-width: 3; }
.node.group .box { fill: var(--group); stroke: var(--faint); stroke-dasharray: 6 3; }
.node.bus .box { fill: color-mix(in srgb, var(--ev) 12%, var(--card)); stroke: var(--ev); }
.node.bus text { font-size: 11px; fill: var(--ev); font-weight: 650; font-family: ui-monospace, Menlo, monospace; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.collection { stroke-dasharray: 7 4; stroke: var(--k-coll); }
.edge.switchable { stroke-dasharray: 2 4; stroke: var(--k-switch); stroke-linecap: round; stroke-width: 2; }
.edge.event { stroke: var(--ev); opacity: .4; }
.edge.context { stroke: var(--ctx); stroke-dasharray: 3 3; opacity: .45; }
.elabel { font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.elabel.event { fill: var(--ev); font-weight: 600; display: none; } .elabel.context { fill: var(--ctx); display: none; }
.elabel.hl { display: inline; }
.box-g rect { fill: none; stroke: var(--line); stroke-width: 1.5; }
.box-g.loose rect { stroke-dasharray: 4 4; }
.box-g text { fill: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 12px; cursor: pointer; }
.box-g .big { display: none; font-weight: 700; fill: var(--ink); }
svg.dim .node:not(.hl) { opacity: .2; }
svg.dim .edge:not(.hl), svg.dim .elabel:not(.hl) { opacity: .06; }
svg.dim .edge.hl { opacity: 1; stroke-width: 2.4; }
.hide-events .event, .hide-context .context { display: none !important; }
/* semantic zoom: far away, cards lose their text and the groups get big labels */
svg.far .node text, svg.far .elabel, svg.far .node .pill { display: none; }
svg.far .edge.event, svg.far .edge.context { display: none; }
svg.far .box-g .small { display: none; } svg.far .box-g .big { display: inline; }
svg.far .box-g rect { fill: color-mix(in srgb, var(--accent) 5%, transparent); }
svg.far .node.group text, svg.far .node.bus text { display: inline; }
/* other views */
.view { position: absolute; inset: 0; overflow: auto; display: none; background: var(--bg); }
.view.on { display: block; }
#icicle svg { display: block; }
#icicle rect { stroke: var(--bg); stroke-width: 1; cursor: pointer; }
#icicle text { font-size: 11px; fill: #fff; pointer-events: none; }
.evtable { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.evtable th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer; }
.evtable td { padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin: 1px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; border: 1px solid transparent; cursor: pointer; }
.chip:hover { border-color: var(--faint); }
.chip small { color: var(--muted); font-family: ui-sans-serif, system-ui; }
.viewbar { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.viewbar input { height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); padding: 0 8px; width: 260px; }
/* detail */
aside.detail { grid-area: detail; width: 0; overflow: hidden; background: var(--panel); border-left: 1px solid var(--line); }
aside.detail.open { width: 380px; }
.detail-inner { width: 380px; height: 100%; overflow: auto; }
.dhead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.dhead h2 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.dhead .close { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; }
.dhead .loc { margin-top: 4px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; overflow-wrap: anywhere; }
.kind { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; color: #fff; }
.dsec { padding: 10px 16px; border-bottom: 1px solid var(--line); }
.dsec h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.rel .r { display: flex; gap: 6px; align-items: baseline; margin-bottom: 3px; }
.rel .lbl { color: var(--muted); width: 74px; flex: none; font-size: 12px; }
.diag { border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; border-left: 3px solid; }
.diag.error { background: var(--err-soft); border-color: var(--err); } .diag.warn { background: var(--warn-soft); border-color: var(--warn); } .diag.info { background: var(--chip); border-color: var(--info); }
.diag .code { font-weight: 700; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.flow { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: 12px; }
.trig { font-size: 10.5px; font-weight: 650; padding: 0 5px; border-radius: 5px; border: 1px solid; }
.sink { font-size: 10px; font-weight: 650; padding: 0 5px; border-radius: 5px; color: #fff; margin-left: 2px; }
.tag { font-size: 10px; font-weight: 650; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.danger { color: var(--err); border-color: var(--err); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">S</div><span id="title"></span><small id="subtitle"></small></div>
  <div class="search">
    <input id="q" placeholder="Find a component, event, action, state key, code… (/)" autocomplete="off" spellcheck="false">
    <span class="count" id="qcount"></span>
    <div class="results" id="results"></div>
  </div>
  <div class="spacer"></div>
  <div class="tabs" role="group" aria-label="View">
    <button class="tab" data-view="graph" aria-pressed="true">Graph</button>
    <button class="tab" data-view="outline">Outline</button>
    <button class="tab" data-view="icicle">Icicle</button>
    <button class="tab" data-view="events">Events</button>
  </div>
  <button class="iconbtn" id="m-theme" title="Light / dark">◐</button>
</header>

<aside class="side">
  <div class="sec"><div class="stats" id="stats"></div></div>
  <div class="sec" id="sec-strat"><h3>Strategies <span style="margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0" id="preset-lbl"></span></h3>
    <div class="ctl">
      <label for="o-preset">Preset</label><select id="o-preset"><option value="auto">auto by size</option><option value="custom">custom</option><option value="spike">spike (flat)</option></select>
      <label for="o-layout">Layout</label><select id="o-layout"><option value="layered">layered (spike)</option><option value="layered-wrap">layered, wrapped rows</option><option value="tidy">tidy tree (d3)</option><option value="dagre">dagre</option><option value="elk">ELK (compound)</option></select>
      <label for="o-render">Render</label><select id="o-render"><option value="svg">SVG</option><option value="canvas">canvas</option></select>
      <label for="o-group">Group by</label><select id="o-group"><option value="none">nothing (islands)</option><option value="dir">directory</option><option value="entry">entry (run root)</option><option value="community">communities</option></select>
      <label for="o-fold">Groups</label><select id="o-fold"><option value="open">open</option><option value="all">folded</option></select>
      <label for="o-depth">Fold subtrees</label><select id="o-depth"><option value="">no</option><option value="2">below depth 2</option><option value="3">below depth 3</option><option value="4">below depth 4</option><option value="5">below depth 5</option></select>
      <label for="o-events">EVENTS</label><select id="o-events"><option value="pairs">emitter → selector</option><option value="bus">bus nodes where they save edges</option><option value="bus-all">a bus node per type</option><option value="off">hidden</option></select>
      <label for="o-focusd">Focus</label><select id="o-focusd"><option value="0">off</option><option value="1">on select, depth 1</option><option value="2">on select, depth 2</option></select>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="o-context" checked> context</label>
      <label><input type="checkbox" id="o-semantic" checked> semantic zoom</label>
      <label><input type="checkbox" id="o-minimap" checked> minimap</label>
    </div>
    <div class="checks" style="margin-top:8px">
      <label><input type="checkbox" id="f-problems"> only problems</label>
      <label><input type="checkbox" id="f-viewonly"> hide view-only leaves</label>
      <label><input type="checkbox" id="f-behavior"> hide behavior actions</label>
      <label><input type="checkbox" id="f-ai"> AI surface only</label>
    </div>
    <div class="ctl" style="margin-top:6px"><label for="f-dir">Directory</label><select id="f-dir"><option value="">all</option></select>
      <label for="f-kind">Kind</label><select id="f-kind"><option value="">all</option><option value="root">root</option><option value="child">child</option><option value="collection-item">collection item</option><option value="switchable">switchable</option></select></div>
  </div>
  <div class="sec" id="sec-health"><h3>Health</h3><div id="health"></div></div>
  <div class="sec" id="sec-outline"><h3>Outline</h3><div class="ol" id="outline"></div></div>
</aside>

<main>
  <svg id="svg">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="var(--edge)"/></marker>
      <marker id="ah-ev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="var(--ev)"/></marker>
      <marker id="ah-ctx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><circle cx="5" cy="5" r="4" fill="var(--ctx)"/></marker>
    </defs>
    <g id="vp"><g id="boxes"></g><g id="edges"></g><g id="labels"></g><g id="nodes"></g></g>
  </svg>
  <canvas id="cv"></canvas>
  <div class="crumbs" id="crumbs"></div>
  <div class="zoombar"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zfit" title="Fit (F)">⤢</button></div>
  <canvas id="minimap" width="440" height="300"></canvas>
  <div class="trace" id="trace"></div>
  <div class="perf" id="perf"></div>
  <div class="view" id="v-outline"><div class="viewbar"><b>Outline</b><span style="color:var(--muted)">render tree from each entry; a component with several parents is listed under each</span></div><div class="ol" id="outline-main" style="padding:8px 12px"></div></div>

  $('health').innerHTML = health.map((h, gi) => `<details class="health-group" ${h.color === 'var(--err)' ? 'open' : ''}><summary><span class="dot" style="margin:0;background:${h.color}"></span>${esc(h.group)}<span class="n">${h.items.length}</span></summary>${h.items.map((it, i) => `<div class="health-item" data-id="${esc(it.id)}"><span class="dot" style="background:${h.color}"></span><div class="t">${esc(it.title)}<small>${esc(it.sub)}</small></div></div>`).join('')}</details>`).join('') || '<div style="color:var(--muted)">✓ No problems</div>'
  $('health').querySelectorAll('.health-item').forEach(n => n.onclick = () => select(n.dataset.id))
}
// outline: the render tree from each entry (lazy: a node's children render when opened)
function olRow(id, depth, parent) {
  const c = M.byId.get(id), kids = M.childrenOf.get(id), wv = worst(c), nd = c.diagnostics.filter(d => d.severity !== 'info').length
  const others = M.parentsOf.get(id).filter(p => p !== parent)
  return `<div class="ol-node" data-id="${esc(id)}" data-depth="${depth}"><div class="ol-row" data-id="${esc(id)}"><span class="tw">${kids.length ? '▸' : ''}</span><span class="k" style="background:${KIND[c.kind]?.[1]}"></span><span>${esc(c.name)}</span><span class="hint">${dupName(id) ? esc(M.dirOf(c.file)) : ''}${others.length && parent ? ` · also in ${others.length}` : ''}</span><span class="b">${c.agent ? '<span class="pillx" style="background:var(--ev)">AI</span>' : ''}${nd ? `<span class="pillx" style="background:${wv === 'error' ? 'var(--err)' : 'var(--warn)'}">${nd}</span>` : ''}${kids.length ? `<span style="color:var(--faint);font-size:11px">${kids.length}</span>` : ''}</span></div></div>`
}
function mountOutline(root) {
  const roots = [...M.roots].sort((a, b) => (M.byId.get(b).entry ? 1 : 0) - (M.byId.get(a).entry ? 1 : 0) || M.byId.get(a).name.localeCompare(M.byId.get(b).name))
  root.innerHTML = roots.map(id => olRow(id, 0, null)).join('')
  root.onclick = (e) => {
    const row = e.target.closest('.ol-row'); if (!row) return
    if (e.target.classList.contains('tw')) { toggleOl(row.parentElement); return }
    select(row.dataset.id, { pan: true })
  }
}
function toggleOl(node, open) {
  const kidsEl = node.querySelector(':scope > .ol-kids')
  const tw = node.querySelector(':scope > .ol-row .tw')
  if (kidsEl) { const show = open ?? kidsEl.style.display === 'none'; kidsEl.style.display = show ? '' : 'none'; tw.textContent = show ? '▾' : '▸'; return kidsEl }
  if (open === false) return null
  const id = node.dataset.id, d = +node.dataset.depth
  const k = document.createElement('div'); k.className = 'ol-kids'
  k.innerHTML = M.childrenOf.get(id).map(ch => olRow(ch, d + 1, id)).join('')
  node.appendChild(k); tw.textContent = '▾'
  return k
}
function revealInOutline(id) {
  for (const root of [$('outline'), $('outline-main')]) {
    if (!root.offsetParent) continue
    const path = []; let p = id; while (p != null) { path.unshift(p); p = M.firstParent.get(p) }
    let scope = root, node = null
    for (const pid of path) { node = scope.querySelector(`:scope > .ol-node[data-id="${CSS.escape(pid)}"]`); if (!node) break; if (pid !== id) scope = toggleOl(node, true) }
    node?.querySelector('.ol-row')?.scrollIntoView({ block: 'nearest' })
  }
  markSelected()
}
mountOutline($('outline')); mountOutline($('outline-main'))

// ───────────────────────── search (results list: works whatever is folded) ─────────────────────────
const hay = new Map(real.map(c => [c.id, [c.name, c.file, ...c.actions.map(a => a.name), ...c.stateKeys, ...c.contextProvides, ...(c.contextConsumes || []), ...c.eventsEmitted, ...c.eventsSelected, ...c.diagnostics.map(d => d.code)].join('\n').toLowerCase()]))
let results = [], ri = 0
function search() {
  const q = $('q').value.trim().toLowerCase()
  if (!q) { $('results').classList.remove('open'); $('qcount').textContent = ''; return }
  const evHits = M.events.filter(e => e.type.toLowerCase().includes(q)).slice(0, 8).map(e => ({ ev: e.type, label: e.type, why: `EVENTS · ${e.emitters.length} → ${e.selectors.length}` }))
  const comps = real.filter(c => hay.get(c.id).includes(q)).map(c => ({ id: c.id, label: c.name, why: c.name.toLowerCase().includes(q) ? '' : whyMatch(c, q), sub: c.file, score: c.name.toLowerCase() === q ? 0 : c.name.toLowerCase().startsWith(q) ? 1 : c.name.toLowerCase().includes(q) ? 2 : 3 })).sort((a, b) => a.score - b.score || a.label.localeCompare(b.label))
  results = [...evHits, ...comps]
  $('qcount').textContent = comps.length
  ri = 0
  $('results').innerHTML = results.slice(0, 40).map((r, i) => `<div class="r${i === 0 ? ' on' : ''}" data-i="${i}"><span>${esc(r.label)}</span>${r.why ? `<span class="why">${esc(r.why)}</span>` : ''}<small>${esc(r.sub ?? '')}</small></div>`).join('') + (results.length > 40 ? `<div class="r" style="color:var(--muted)">… ${results.length - 40} more</div>` : '')
  $('results').classList.add('open')
  $('results').querySelectorAll('.r[data-i]').forEach(n => n.onmousedown = (e) => { e.preventDefault(); pickResult(+n.dataset.i) })
}
function whyMatch(c, q) { for (const [l, list] of [['emits', c.eventsEmitted], ['selects', c.eventsSelected], ['action', c.actions.map(a => a.name)], ['state', c.stateKeys], ['reads', c.contextConsumes || []], ['provides', c.contextProvides], ['code', c.diagnostics.map(d => d.code)]]) { const h = list.find(x => x.toLowerCase().includes(q)); if (h) return `${l} ${h}` } return 'path' }
function pickResult(i) { const r = results[i]; if (!r) return; $('results').classList.remove('open'); $('q').blur(); if (r.ev) { if (S.view === 'events') { $('ev-q').value = r.ev; renderEvents() } else trace('event', r.ev) } else select(r.id) }
$('q').addEventListener('input', search)
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); ri = Math.max(0, Math.min(results.length - 1, ri + (e.key === 'ArrowDown' ? 1 : -1))); $('results').querySelectorAll('.r').forEach((n, i) => n.classList.toggle('on', i === ri)) }
  if (e.key === 'Enter') pickResult(ri)
  if (e.key === 'Escape') { $('q').value = ''; search(); $('q').blur() }
})
$('q').addEventListener('blur', () => setTimeout(() => $('results').classList.remove('open'), 150))

// ───────────────────────── other views ─────────────────────────
function setView(v) {
  S.view = v
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.view === v))
  for (const x of ['outline', 'icicle', 'events']) $('v-' + x).classList.toggle('on', v === x)
  for (const x of ['zoombar', 'perf']) document.querySelector('.' + x) && (document.querySelector('.' + x).style.display = v === 'graph' ? '' : 'none')
  mm.style.display = v === 'graph' && S.minimap ? 'block' : 'none'
  if (v === 'icicle') renderIcicle()
  if (v === 'events') renderEvents()
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => setView(t.dataset.view))
// icicle: the first-parent spanning tree, partitioned top-down; click zooms into a subtree
let icRoot = null
function renderIcicle() {
  const size = $('ic-size').value, color = $('ic-color').value
  const host = $('icicle'), W = host.clientWidth || 1000, RH = 26
  const weight = (id) => { const c = M.byId.get(id); return size === 'actions' ? Math.max(0.5, c.actions.length) : size === 'state' ? Math.max(0.5, c.stateKeys.length) : 1 }
  const tot = new Map()
  const sum = (id) => { let s = weight(id); for (const k of M.treeKids.get(id)) s += sum(k); tot.set(id, s); return s }
  const tops = icRoot ? [icRoot] : M.roots
  let all = 0; for (const r of tops) all += sum(r)
  const rects = []
  let maxD = 0
  const part = (id, x, w, d) => { rects.push([id, x, w, d]); maxD = Math.max(maxD, d); let cx = x + w * weight(id) / tot.get(id) * 0; const kids = M.treeKids.get(id); const kw = w * (tot.get(id) - weight(id)) / tot.get(id); let off = x + (w - kw) / 2; for (const k of kids) { const kw2 = kw * tot.get(k) / (tot.get(id) - weight(id)); part(k, off, kw2, d + 1); off += kw2 } void cx }
  let x = 0; for (const r of tops) { const w = W * tot.get(r) / all; part(r, x, w, 0); x += w }
  const dirs = [...new Set(real.map(c => c.file.split('/').slice(0, 3).join('/')))]
  const hue = (c) => color === 'health' ? (worst(c) === 'error' ? css('--err') : worst(c) === 'warn' ? css('--warn') : c.agent ? css('--ev') : '#94a3b8') : color === 'dir' ? `hsl(${(dirs.indexOf((c.file ?? '').split('/').slice(0, 3).join('/')) * 47) % 360} 55% 50%)` : { root: css('--k-root'), child: '#64748b', 'collection-item': css('--k-coll'), switchable: css('--k-switch') }[c.kind] ?? '#94a3b8'
  host.innerHTML = `<svg width="${W}" height="${(maxD + 1) * RH + 4}">${rects.map(([id, x, w, d]) => { const c = M.byId.get(id); return `<g data-id="${esc(id)}"><rect x="${x}" y="${d * RH}" width="${Math.max(0.5, w)}" height="${RH - 1}" fill="${hue(c)}"${id === S.selected ? ' stroke="var(--ink)" stroke-width="2"' : ''}><title>${esc(c.name)} · ${esc(c.file)}</title></rect>${w > 46 ? `<text x="${x + 4}" y="${d * RH + 17}">${esc(c.name.slice(0, Math.floor(w / 7)))}</text>` : ''}</g>` }).join('')}</svg>`
  host.querySelectorAll('g[data-id]').forEach(g => { g.onclick = (e) => { if (e.shiftKey || e.altKey) { select(g.dataset.id) } else { icRoot = M.treeKids.get(g.dataset.id).length ? g.dataset.id : icRoot; renderIcicle(); renderDetail(M.byId.get(g.dataset.id)); S.selected = g.dataset.id; $('detail').classList.add('open') } } })
  $('ic-path').textContent = icRoot ? 'in ' + M.byId.get(icRoot).name + ' (click a block to zoom, shift-click to open it in the graph)' : 'click a block to zoom in, shift-click to open it in the graph'
}
$('ic-size').onchange = $('ic-color').onchange = renderIcicle
$('ic-up').onclick = () => { icRoot = icRoot ? (M.firstParent.get(icRoot) ?? null) : null; renderIcicle() }
// EVENTS table: emitter × event × selector
let evSort = 'type'
function renderEvents() {
  const q = $('ev-q').value.trim().toLowerCase()
  const name = (id) => M.byId.get(id).name
  let rows = M.events.filter(e => !q || e.type.toLowerCase().includes(q) || [...e.emitters, ...e.selectors].some(id => name(id).toLowerCase().includes(q)))
  rows = rows.sort((a, b) => evSort === 'emitters' ? b.emitters.length - a.emitters.length : evSort === 'selectors' ? b.selectors.length - a.selectors.length : a.type.localeCompare(b.type))
  $('ev-n').textContent = `${rows.length} of ${M.events.length} types`
  const list = (ids) => ids.length ? ids.map(id => chip(esc(name(id)) + (dupName(id) ? ` <small>${esc(where(id))}</small>` : ''), `data-goto="${esc(id)}"`)).join('') : '<span style="color:var(--warn)">⚠ none</span>'
  $('evtable').innerHTML = `<thead><tr><th data-s="type">Event type</th><th data-s="emitters">Emitted by</th><th data-s="selectors">Selected (handled) by</th></tr></thead><tbody>${rows.slice(0, 600).map(e => `<tr><td class="mono"><b>${esc(e.type)}</b></td><td>${list(e.emitters)}</td><td>${list(e.selectors)}</td></tr>`).join('')}</tbody>`
  $('evtable').querySelectorAll('th').forEach(th => th.onclick = () => { evSort = th.dataset.s; renderEvents() })
  $('evtable').querySelectorAll('[data-goto]').forEach(n => n.onclick = () => select(n.dataset.goto))
}
$('ev-q').oninput = renderEvents

// ───────────────────────── keys, theme, start ─────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, select, textarea')) return
  if (e.key === '/') { e.preventDefault(); $('q').focus() } else if (e.key === 'f' || e.key === 'F') { fit() } else if (e.key === 'Escape') { select(null); endTrace() }
})
$('m-theme').onclick = () => { const dark = getComputedStyle(document.documentElement).colorScheme === 'dark'; document.documentElement.dataset.theme = dark ? 'light' : 'dark'; draw(); apply() }
addEventListener('resize', () => { if (S.render === 'canvas') redraw() })
/** Measurement hook (measure-browser.mjs): pan and zoom for `frames` frames, return the frame intervals. */
window.__bench = (frames = 120) => new Promise(res => {
  const r = canvasRect(), out = []; let i = 0, last = performance.now()
  const step = (t) => { out.push(t - last); last = t; const f = i % 60 < 30 ? 1.02 : 1 / 1.02; zoomAt(f, r.width / 2, r.height / 2); view.x += (i % 40 < 20 ? 6 : -6); apply(); if (++i < frames) requestAnimationFrame(step); else res(out.slice(2)) }
  requestAnimationFrame(step)
})
window.__S = S; window.__M = M; window.__select = select; window.__setView = setView
syncControls()
setView(S.view)
await rebuild({ fit: true })
perf.scriptToPaint = performance.now() - performance.getEntriesByName('script-start')[0].startTime
const sel0 = P.get('select') ?? META.select; if (sel0) { const c = real.find(x => x.name === sel0); if (c) select(c.id) }
</script>
