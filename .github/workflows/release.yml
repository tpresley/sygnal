# Publishes every version in this commit that isn't published yet, with no stored credentials.
#
#   plan      which versions are new (scripts/release-plan.mjs): the three npm packages, the VS Code
#             extension (Marketplace + Open VSX) and the Claude Code plugin (a git tag)
#             and, for a new sygnal / extension version, its `## <version>` CHANGELOG heading (fails
#             here, before anything is published; a dry run warns)
#   gates     RELEASING.md's gates (gates.yml), when anything is new
#   publish   environment `release`: waits for a required reviewer's approval, then publishes
#             - npm: trusted publishing (OIDC; provenance is automatic), sygnal-check → sygnal →
#               create-sygnal-app, then tag v<sygnal> + a GitHub release from CHANGELOG.md
#             - VS Code Marketplace: Microsoft Entra ID (azure/login with OIDC, then
#               `vsce publish --azure-credential`); skipped while the environment has no
#               AZURE_CLIENT_ID variable
#             - Open VSX: trusted publishing (`ovsx publish --trusted-publishing`)
#             - tags vscode-v<version> (with the .vsix) and sygnal--v<version>
#   smoke     every template from the registry (scripts/release-smoke.mjs --registry)
#
# It starts when a version file changes on main, or by hand (Actions → Release → Run workflow).
# A manual run is a dry run by default: every target counts as new, `npm publish --dry-run` (`npm
# pack --dry-run` for a version npm already has), `vsce verify-pat --azure-credential`, nothing
# uploaded or tagged. Re-running after a failure
# publishes only what is still missing. The trust on npm, Open VSX and Azure is pinned to this
# file (release.yml) and the environment `release` (main only, required reviewer).
name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - sygnal-check/package.json
      - create-sygnal-app/package.json
      - editors/vscode/package.json
      - editors/claude-code/.claude-plugin/plugin.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: verify and check sign-in, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      sygnal: ${{ steps.plan.outputs.sygnal }}
      sygnal_version: ${{ steps.plan.outputs.sygnal_version }}
      sygnal_published: ${{ steps.plan.outputs.sygnal_published }}
      check: ${{ steps.plan.outputs.check }}
      check_version: ${{ steps.plan.outputs.check_version }}
      check_published: ${{ steps.plan.outputs.check_published }}
      csa: ${{ steps.plan.outputs.csa }}
      csa_version: ${{ steps.plan.outputs.csa_version }}
      csa_published: ${{ steps.plan.outputs.csa_published }}
      vscode: ${{ steps.plan.outputs.vscode }}
      vscode_version: ${{ steps.plan.outputs.vscode_version }}
      plugin: ${{ steps.plan.outputs.plugin }}
      plugin_version: ${{ steps.plan.outputs.plugin_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        run: node scripts/release-plan.mjs ${{ env.DRY_RUN == 'true' && '--all' || '' }}
      # The publish job reads the release notes after npm publishing; check the headings here, before
      # the gates and the approval, so a missing one stops the release with nothing half-published.
      # Same match as the notes steps below. A dry run only warns (CHANGELOG.md keeps
      # `## [Unreleased]` until release prep renames it).
      - name: CHANGELOG headings for the new versions
        env:
          SYGNAL_NEW: ${{ steps.plan.outputs.sygnal }}
          SYGNAL: ${{ steps.plan.outputs.sygnal_version }}
          VSCODE_NEW: ${{ steps.plan.outputs.vscode }}
          VSCODE: ${{ steps.plan.outputs.vscode_version }}
        run: |
          level=error; [ "$DRY_RUN" = true ] && level=warning
          missing=0
          has() { awk -v v="$2" '$0 ~ "^## " v "( |$)" {f=1} END {exit !f}' "$1"; }
          if [ "$SYGNAL_NEW" = true ] && ! has CHANGELOG.md "$SYGNAL"; then
            echo "::$level::CHANGELOG.md has no '## $SYGNAL' heading"; missing=1
          fi
          if [ "$VSCODE_NEW" = true ] && ! has editors/vscode/CHANGELOG.md "$VSCODE"; then
            echo "::$level::editors/vscode/CHANGELOG.md has no '## $VSCODE' heading"; missing=1
          fi
          [ "$missing" = 0 ] || [ "$level" = warning ]

  gates:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/gates.yml

  publish:
    needs: [plan, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write   # tags and GitHub releases
      id-token: write   # OIDC for npm, Open VSX and Azure: no stored tokens
    env:
      SYGNAL: ${{ needs.plan.outputs.sygnal_version }}
      CHECK: ${{ needs.plan.outputs.check_version }}
      CSA: ${{ needs.plan.outputs.csa_version }}
      VSCODE: ${{ needs.plan.outputs.vscode_version }}
      PLUGIN: ${{ needs.plan.outputs.plugin_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a==11&&(b>5||(b==5&&c>=1)))?0:1)" "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing"; exit 1; }
      - name: Install (sygnal's prepublishOnly builds dist/)
        run: npm ci
      - name: Tag helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # ---- npm: sygnal-check, then sygnal, then create-sygnal-app (its templates need both) ----
      # A dry run of a version npm already has packs it instead (`npm publish --dry-run` asks the
      # registry, and refuses a published version); sygnal is built first, as prepublishOnly would.
      - name: Publish sygnal-check ${{ env.CHECK }}
        if: needs.plan.outputs.check == 'true'
        run: |
          if [ "$DRY_RUN" = true ] && [ "${{ needs.plan.outputs.check_published }}" = true ]; then
            npm pack --dry-run --prefix sygnal-check ./sygnal-check
          else
            npm publish --prefix sygnal-check ./sygnal-check ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
          fi
      - name: Publish sygnal ${{ env.SYGNAL }}
        if: needs.plan.outputs.sygnal == 'true'
        run: |
          if [ "$DRY_RUN" = true ] && [ "${{ needs.plan.outputs.sygnal_published }}" = true ]; then
            npm run build:all && npm pack --dry-run
          else
            npm publish ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
          fi
      - name: Publish create-sygnal-app ${{ env.CSA }}
        if: needs.plan.outputs.csa == 'true'
        run: |
          if [ "$DRY_RUN" = true ] && [ "${{ needs.plan.outputs.csa_published }}" = true ]; then
            npm pack --dry-run --prefix create-sygnal-app ./create-sygnal-app
          else
            npm publish --prefix create-sygnal-app ./create-sygnal-app ${{ env.DRY_RUN == 'true' && '--dry-run' || '' }}
          fi
      - name: Tag v${{ env.SYGNAL }} and create its GitHub release
        if: needs.plan.outputs.sygnal == 'true' && env.DRY_RUN != 'true'
        run: |
          awk -v v="$SYGNAL" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no '## $SYGNAL' entry"; exit 1; }
          git tag "v$SYGNAL" && git push origin "v$SYGNAL"
          gh release create "v$SYGNAL" --title "$SYGNAL" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

      # ---- the VS Code extension: the .vsix the gates built and tested ----
      - name: Get the .vsix from the gates
        if: needs.plan.outputs.vscode == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      - name: Install vsce (pinned by editors/vscode)
        if: needs.plan.outputs.vscode == 'true'
        run: npm ci --prefix editors/vscode
      - name: Sign in to Microsoft Entra ID (OIDC, no secret)
        if: needs.plan.outputs.vscode == 'true' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: VS Code Marketplace ${{ env.VSCODE }}
        if: needs.plan.outputs.vscode == 'true' && vars.AZURE_CLIENT_ID != ''
        working-directory: editors/vscode
        run: |
          if [ "$DRY_RUN" = true ]; then
            npx vsce verify-pat --azure-credential sygnal
          else
            npx vsce publish --azure-credential --skip-duplicate --packagePath "$RUNNER_TEMP/vsix/sygnal-$VSCODE.vsix"
          fi
      - name: VS Code Marketplace skipped (no AZURE_CLIENT_ID)
        if: needs.plan.outputs.vscode == 'true' && vars.AZURE_CLIENT_ID == ''
        run: echo "::warning::The release environment has no AZURE_CLIENT_ID variable, so the Marketplace wasn't published to. See RELEASING.md §8."
      - name: Open VSX ${{ env.VSCODE }}
        if: needs.plan.outputs.vscode == 'true' && env.DRY_RUN != 'true'
        run: npx --yes ovsx@1.2.0 publish "$RUNNER_TEMP/vsix/sygnal-$VSCODE.vsix" --trusted-publishing --skip-duplicate
      - name: Tag vscode-v${{ env.VSCODE }} and attach the .vsix
        if: needs.plan.outputs.vscode == 'true' && env.DRY_RUN != 'true'
        run: |
          awk -v v="$VSCODE" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' editors/vscode/CHANGELOG.md > "$RUNNER_TEMP/vscode-notes.md"
          git tag "vscode-v$VSCODE" && git push origin "vscode-v$VSCODE"
          gh release create "vscode-v$VSCODE" "$RUNNER_TEMP/vsix/sygnal-$VSCODE.vsix" --title "VS Code extension $VSCODE" --notes-file "$RUNNER_TEMP/vscode-notes.md" --verify-tag

      # ---- the Claude Code plugin: installs follow main; the tag is for history ----
      - name: Tag sygnal--v${{ env.PLUGIN }}
        if: needs.plan.outputs.plugin == 'true' && env.DRY_RUN != 'true'
        run: git tag "sygnal--v$PLUGIN" && git push origin "sygnal--v$PLUGIN"

  smoke:
    needs: [plan, publish]
    if: >-
      github.event_name == 'push' &&
      (needs.plan.outputs.sygnal == 'true' || needs.plan.outputs.check == 'true' || needs.plan.outputs.csa == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright's Chromium (the Vike browser check)
        run: |
          npm ci --prefix browser-tests
          npx --prefix browser-tests playwright install --with-deps chromium
      - name: Wait until the registry serves the new versions (npm processes a publish for a few minutes)
        run: |
          want() { node -p "require('./$1').version"; }
          for pkg in "sygnal package.json" "sygnal-check sygnal-check/package.json" "create-sygnal-app create-sygnal-app/package.json"; do
            set -- $pkg; v=$(want "$2")
            for i in $(seq 1 60); do
              [ "$(npm view "$1@$v" version 2>/dev/null)" = "$v" ] && { echo "$1@$v is on the registry"; break; }
              [ "$i" = 60 ] && { echo "::error::$1@$v isn't on the registry after 30 minutes"; exit 1; }
              sleep 30
            done
          done
      - name: Smoke every template from the registry
        run: node scripts/release-smoke.mjs --registry --dir "$RUNNER_TEMP/smoke"
      - name: Keep the logs of a failed smoke
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-smoke-logs
          path: ${{ runner.temp }}/smoke/*.log
