interface:
  display_name: "Sygnal Dev"
  short_description: "Build, test, and debug Sygnal apps with the canonical forms."
  default_prompt: "Use the Sygnal canonical forms (object-form model entries, event() for EVENTS, CHILD.select(Component), ABORT for no change) to implement the change: state, then intent, model, view, and a renderComponent test. Run npm test and npx sygnal-check --strict, and use npx sygnal-check explain SYGnnn for any diagnostic."
