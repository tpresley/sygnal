interface:
  display_name: "Sygnal Dev"
  short_description: "Build, test, and debug Sygnal apps with the canonical forms."
  default_prompt: "Use the Sygnal canonical forms (object-form model entries, event() for EVENTS, CHILD.select(Component), ABORT for no change) to implement the change: state, then intent, model, view, and a renderComponent test. Run npm test and, when sygnal-check is installed, npx --no-install sygnal-check --strict; use npx --no-install sygnal-check explain SYGnnn (or the online error reference) for any diagnostic."
